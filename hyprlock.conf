# General Settings
general {
    hide_cursor = true
    ignore_empty_input = true
}

# Smooth Animations
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 4, easeOutQuint
    animation = inputFieldDots, 1, 3, easeOutQuint
}

# Frosted Glass Desktop Background
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.89
    brightness = 0.81
    vibrancy = 0.20
    color = rgba(121318ee)
}

# Top-Right Battery Status Indicator
label {
    monitor =
    text = cmd[update:5000] echo "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo '100')% 󰁹"
    color = rgba(c6c5d0aa)
    font_size = 12
    font_family = Adwaita Sans
    position = -30, -20
    halign = right
    valign = top
}

# Clock Display
label {
    monitor =
    text = $TIME
    color = rgba(bac3ffff)
    font_size = 90
    font_family = Oswald
    position = 0, 120
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_boost = 1.2
    shadow_color = rgba(00000088)
}

# Date Display
label {
    monitor =
    text = cmd[update:43200000] date '+%A, %B %d'
    color = rgba(c6c5d0dd)
    font_size = 18
    font_family = Adwaita Sans
    position = 0, 50
    halign = center
    valign = center

    shadow_passes = 1
    shadow_boost = 1.0
    shadow_color = rgba(00000066)
}

# User Greeting
label {
    monitor =
    text = 󰍂  Welcome back, <span weight="bold">$USER</span>
    color = rgba(e3e1e9ee)
    font_size = 15
    font_family = Adwaita Sans
    position = 0, -20
    halign = center
    valign = center
}

# Interactive Password Field
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    
    inner_color = rgba(29292fcc)
    outer_color = rgba(90909a88) rgba(bac3ff88) 45deg
    check_color = rgba(bac3ffff) rgba(c3c5ddff) 120deg
    fail_color = rgba(ffb4abff) rgba(93000aff) 40deg
    capslock_color = rgba(c3c5ddff)

    font_color = rgba(e3e1e9ff)
    font_family = JetBrainsMono Nerd Font Mono

    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1

    fade_on_empty = false
    placeholder_text = <span foreground="##c6c5d0">󰌾  Enter Password...</span>
    fail_text = <b>???</b>

    hide_input = false
    rounding = 14

    position = 0, -80
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(00000066)
}

# Active Keyboard Layout Indicator
label {
    monitor =
    text = $LAYOUT
    color = rgba(c6c5d088)
    font_size = 11
    font_family = Adwaita Sans
    position = 0, -135
    halign = center
    valign = center
}

# Currently Playing Music Track
label {
    monitor =
    text = cmd[update:1000] sh -c 't=$(playerctl metadata title 2>/dev/null); a=$(playerctl metadata artist 2>/dev/null); [ -n "$t" ] && echo "󰎆  $t - $a"'
    color = rgba(c6c5d099)
    font_size = 12
    font_family = Adwaita Sans
    position = 0, 30
    halign = center
    valign = bottom
}