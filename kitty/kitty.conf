# --- the "i type things and stuff happens" module ---
# kitty config. lowercase. simple.

# --- fonts (you have jetbrains nerd, use it) ---
font_family JetBrainsMono Nerd Font
font_size 11.0
bold_font auto
italic_font auto
bold_italic_font auto

# --- spacing so text doesn't give me a headache ---
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0

# --- transparency (matugen handles the colors) ---
background_opacity 0.8
dynamic_background_opacity yes

# --- cursor trail (makes me feel fast) ---
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# --- no bell. i know when i fuck up. ---
enable_audio_bell no

# --- includes ---
include colors.conf
include font-hack.conf

# --- mouse things (because clicking is sometimes faster) ---
mouse_hide_wait 2.0
url_color #8ad0ef
url_style curly

# --- scrolling (smooth like butter) ---
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# --- clipboard (because copy/paste is life) ---
copy_on_select yes
strip_trailing_spaces never

# --- tabs (you probably use them) ---
tab_bar_edge bottom
tab_bar_style powerline
tab_separator " "

# --- keyboard shortcuts (i forget them anyway) ---
# ctrl+shift+c = copy
# ctrl+shift+v = paste
# ctrl+shift+f = find
# ctrl+shift+h = show/hide scrollback

# --- scrollback (so i can see what i did 5 minutes ago) ---
scrollback_lines 10000
scrollback_pager less
scrollback_pager_history_size 0