source = ~/.config/hypr/hyprlock-colors.conf

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.6172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# big time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $on_surface
    font_size = 80
    font_family = Noto Sans Bold
    position = 0, 160
    halign = center
    valign = center
}

# date & mood
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $primary
    font_size = 18
    font_family = Noto Sans Medium
    position = 0, 90
    halign = center
    valign = center
}

# user kaomoji badge
label {
    monitor =
    text = ( ᐛ )و
    color = $on_surface_variant
    font_size = 20
    position = 0, 10
    halign = center
    valign = center
}

# password input
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = $primary
    inner_color = $surface_container_high
    font_color = $on_surface
    fade_on_empty = false
    placeholder_text = <span foreground="##cac4d0">enter password...</span>
    hide_input = false
    check_color = $primary
    fail_color = $error
    fail_text = <i>incorrect password</i>
    fail_transition = 300
    position = 0, -60
    halign = center
    valign = center
}
