# ~/.config/yazi/keymap.toml

# 1. Nautilus-style Enter (smart-enter plugin) & Backspace
[[manager.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter directory or open file"

[[manager.prepend_keymap]]
on   = "<Backspace>"
run  = "leave"
desc = "Go back to parent directory"

# 2. File Operations
[[manager.prepend_keymap]]
on   = "n"
run  = "create"
desc = "Create a new file or directory"

[[manager.prepend_keymap]]
on   = "r"
run  = "rename"
desc = "Rename selected file"

[[manager.prepend_keymap]]
on   = "d"
run  = "remove"
desc = "Move selected to trash"

# 3. Zoxide jump (replaces default 'z')
[[manager.prepend_keymap]]
on   = "z"
run  = "plugin zoxide"
desc = "Jump to directory via zoxide"
