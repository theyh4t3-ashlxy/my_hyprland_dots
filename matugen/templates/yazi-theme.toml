# ~/.config/matugen/templates/yazi-theme.toml

[app]
# Overall app background style
overall = { bg = "{{colors.surface.default.hex}}" }

[mgr]
# Current working directory (CWD) text
cwd = { fg = "{{colors.primary.default.hex}}" }

# Find and search highlights
find_keyword  = { fg = "{{colors.primary.default.hex}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{colors.tertiary.default.hex}}", bg = "reset", bold = true, italic = true }

# Symbolic links
symlink_target = { fg = "{{colors.secondary.default.hex}}", italic = true }

# Selection / Copy / Cut Markers
marker_copied   = { fg = "{{colors.surface_variant.default.hex}}", bg = "{{colors.primary.default.hex}}" }
marker_cut      = { fg = "{{colors.surface_variant.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked   = { fg = "{{colors.surface_variant.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
marker_selected = { fg = "{{colors.surface_variant.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
marker_symbol   = "│"

# Pane layout borders
border_symbol = "│"
border_style  = { fg = "{{colors.outline.default.hex}}" }

# Highlighted / Hovered item row (Vibrant Matugen Peach Highlight)
hovered       = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
preview_border = { fg = "{{colors.outline.default.hex}}" }

[tabs]
# Top tab bar styling
active   = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

[mode]
# Bottom-left Mode Pills
normal_main = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

select_main = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

unset_main  = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }
unset_alt   = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

[status]
# Status bar general layout
separator_open  = ""
separator_close = ""
overall = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface.default.hex}}" }

# Progress / Position indicators (Bottom-right styling)
progress_label  = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface.default.hex}}" }
progress_error  = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface.default.hex}}" }

# Permissions flags
perm_sep   = { fg = "{{colors.outline.default.hex}}" }
perm_type  = { fg = "{{colors.primary.default.hex}}" }
perm_read  = { fg = "{{colors.secondary.default.hex}}" }
perm_write = { fg = "{{colors.error.default.hex}}" }
perm_exec  = { fg = "{{colors.tertiary.default.hex}}" }

[input]
# Text input prompts
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}" }
value    = { fg = "{{colors.on_surface.default.hex}}" }
selected = { bg = "{{colors.surface_variant.default.hex}}" }

[select]
# Option dropdown menus
border   = { fg = "{{colors.primary.default.hex}}" }
active   = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
inactive = { fg = "{{colors.on_surface.default.hex}}" }

[completion]
# Autocomplete selection menus
border   = { fg = "{{colors.primary.default.hex}}" }
active   = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
inactive = { fg = "{{colors.on_surface.default.hex}}" }

[tasks]
# Background task popup menu
border  = { fg = "{{colors.primary.default.hex}}" }
title   = { fg = "{{colors.primary.default.hex}}" }
hovered = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }

[which]
# Key combination visual assistance popup
mask = { bg = "{{colors.surface_variant.default.hex}}" }
cand = { fg = "{{colors.tertiary.default.hex}}" }
rest = { fg = "{{colors.outline.default.hex}}" }

[notify]
# Toast notification alerts
title_info  = { fg = "{{colors.primary.default.hex}}" }
title_warn  = { fg = "{{colors.secondary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

# yazi colors recolored from wallpaper
[filetype]
rules = [
    # directories that dont use default blue
    { url = "*/", fg = "{{colors.primary.default.hex}}", bold = true },

    # media and documents
    { mime = "image/*", fg = "{{colors.tertiary.default.hex}}" },
    { mime = "video/*", fg = "{{colors.tertiary.default.hex}}" },
    { mime = "audio/*", fg = "{{colors.tertiary.default.hex}}" },
    { mime = "application/{tar,g-tar,bzip*,gzip,zip,compress*,7z*,rar}", fg = "{{colors.secondary.default.hex}}" },
    { mime = "application/pdf", fg = "{{colors.secondary.default.hex}}" },

    # fallback text
    { url = "*", fg = "{{colors.on_surface.default.hex}}" }
]

# custom folder icons
[icon]
prepend_dirs = [
    { name = "Desktop",   text = "", fg = "{{colors.primary.default.hex}}" },
    { name = "Documents", text = "", fg = "{{colors.primary.default.hex}}" },
    { name = "Downloads", text = "", fg = "{{colors.primary.default.hex}}" },
    { name = "Music",     text = "", fg = "{{colors.primary.default.hex}}" },
    { name = "Pictures",  text = "", fg = "{{colors.primary.default.hex}}" },
    { name = "Videos",    text = "", fg = "{{colors.primary.default.hex}}" },
    { name = "Projects",  text = "", fg = "{{colors.primary.default.hex}}" },
    { name = "Public",    text = "", fg = "{{colors.primary.default.hex}}" },
    { name = "Templates", text = "", fg = "{{colors.primary.default.hex}}" },
    { name = "*",         text = "", fg = "{{colors.primary.default.hex}}" }
]
